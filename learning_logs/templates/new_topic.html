{% extends "base.html" %}
{% load bootstrap3 %}
 {% block header %}
  <h2>Add a new topic:</h2>
{% endblock header %}
{% block content %}
   <form action="{% url 'learning_logs:new_topic' %}" method='post'
      class="form">
    {% csrf_token %}
     {% bootstrap_form form %}
     {% buttons %}
      <button name="submit" class="btn btn-primary">add topic</button>
    {% endbuttons %}
  </form>
{% endblock content %}

<!--new_topic.html then  then /new_topic/ then urls.py then views.new_topic  -->

  <!-- to prevent attackers from using the form to gain unauthorized access to the server (this kind of attack is called a cross-site request forgery).-->

   <!--The as_p modifier tells Django to render all the form elements in paragraph format, which is a simple way to display the form neatly.-->
